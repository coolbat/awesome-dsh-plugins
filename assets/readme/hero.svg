<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Awesome DSH Plugins</title>
  <desc id="desc">An evidence-led DeepSeek Harness plugin directory showing a fixed source commit flowing through manifest and patch checks to a review decision.</desc>

  <rect width="1200" height="380" rx="28" fill="#0B1220"/>
  <path d="M60 42H1140" stroke="#263247"/>
  <path d="M720 74V312" stroke="#263247"/>

  <g id="title-block" transform="translate(60 72)">
    <text x="0" y="0" fill="#86A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">EVIDENCE-LED DIRECTORY / DEEPSEEK HARNESS</text>
    <text x="0" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="58" font-weight="760">Awesome DSH</text>
    <text x="0" y="130" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="58" font-weight="760">Plugins</text>
    <text x="0" y="178" fill="#A9B5C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">Fixed commits. Visible evidence. Honest uncertainty.</text>

    <g transform="translate(0 218)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect width="132" height="38" rx="19" fill="#15213A" stroke="#31405C"/>
      <circle cx="20" cy="19" r="5" fill="#39D98A"/>
      <text x="34" y="24" fill="#DDE5F2">28 REVIEWED</text>

      <rect x="146" width="102" height="38" rx="19" fill="#15213A" stroke="#31405C"/>
      <circle cx="166" cy="19" r="5" fill="#F8C15C"/>
      <text x="180" y="24" fill="#DDE5F2">5 HELD</text>

      <rect x="262" width="126" height="38" rx="19" fill="#15213A" stroke="#31405C"/>
      <circle cx="282" cy="19" r="5" fill="#A9B5C8"/>
      <text x="296" y="24" fill="#DDE5F2">1 EXCLUDED</text>
    </g>
  </g>

  <g id="evidence-chain" transform="translate(760 78)">
    <text x="0" y="0" fill="#A9B5C8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">ONE REVIEW RECORD</text>

    <g transform="translate(0 28)">
      <rect width="380" height="52" rx="12" fill="#101A2C" stroke="#31405C"/>
      <text x="18" y="21" fill="#7F91AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">SOURCE</text>
      <text x="18" y="40" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">owner/repo@b6a879c…</text>
    </g>

    <path d="M190 80V98" stroke="#4D6BFE" stroke-width="2"/>
    <path d="M184 93L190 99L196 93" fill="none" stroke="#4D6BFE" stroke-width="2"/>

    <g transform="translate(0 100)">
      <rect width="380" height="52" rx="12" fill="#101A2C" stroke="#31405C"/>
      <text x="18" y="21" fill="#7F91AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">MANIFEST</text>
      <text x="18" y="40" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">package.json :: dsh.bundle.patch</text>
    </g>

    <path d="M190 152V170" stroke="#4D6BFE" stroke-width="2"/>
    <path d="M184 165L190 171L196 165" fill="none" stroke="#4D6BFE" stroke-width="2"/>

    <g transform="translate(0 172)">
      <rect width="380" height="52" rx="12" fill="#101A2C" stroke="#31405C"/>
      <text x="18" y="21" fill="#7F91AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">REFERENCED PATCH</text>
      <text x="18" y="40" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">cordis.patch.yml ✓ exists</text>
    </g>

    <path d="M190 224V242" stroke="#4D6BFE" stroke-width="2"/>
    <path d="M184 237L190 243L196 237" fill="none" stroke="#4D6BFE" stroke-width="2"/>

    <g transform="translate(0 244)">
      <rect width="380" height="52" rx="12" fill="#10261F" stroke="#277A59"/>
      <circle cx="24" cy="26" r="7" fill="#39D98A"/>
      <text x="42" y="21" fill="#74E3AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">DECISION</text>
      <text x="42" y="41" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">REVIEWED — NOT SECURITY-AUDITED</text>
    </g>
  </g>

  <text x="60" y="346" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">STRUCTURE ≠ SAFETY  ·  LICENSE ≠ IDENTITY  ·  POPULARITY ≠ COMPATIBILITY</text>
</svg>
